name: shell-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository layout and Bash syntax
        run: bash tools/verify-layout.sh
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq openssl
      - name: Run ShellCheck
        run: |
          shellcheck --version
          status=0
          shellcheck -f json1 install.sh v2ray.sh config/defaults.sh tools/verify-layout.sh tests/*.sh > shellcheck.json || status=$?
          if (( status != 0 )); then
            jq -r '.comments[] | "::error file=\(.file),line=\(.line),col=\(.column)::SC\(.code): \(.message)"' shellcheck.json
            exit "$status"
          fi
      - name: Run unit tests
        run: |
          status=0
          bash tests/unit.sh > unit-test.log 2>&1 || status=$?
          cat unit-test.log
          if (( status != 0 )); then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < unit-test.log
            exit "$status"
          fi
      - name: Run update and recovery regression tests
        run: |
          bash tests/recovery.sh
          bash tests/bootstrap.sh
          bash tests/editing.sh
          bash tests/hardening.sh

  xray-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq unzip openssl python3
      - name: Validate generated configuration with latest stable Xray
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/xray-config.sh
