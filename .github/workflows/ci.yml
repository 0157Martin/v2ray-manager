name: shell-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository layout and Bash syntax
        run: bash tools/verify-layout.sh
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq openssl
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck install.sh v2ray.sh config/defaults.sh tools/verify-layout.sh tests/*.sh
      - name: Run unit tests
        run: bash tests/unit.sh
      - name: Run update and recovery regression tests
        run: |
          bash tests/recovery.sh
          bash tests/bootstrap.sh

  xray-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq unzip openssl python3
      - name: Validate generated configuration with latest stable Xray
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/xray-config.sh
